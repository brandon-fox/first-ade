# Unified fast compliance checks for local commits and pushes.
default_stages: [pre-commit]
exclude: ^templates/

repos:
  - repo: local
    hooks:
      - id: first-ade-check
        name: First-ADE Deterministic Guardrails
        entry: uv run first-ade check --staged
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-ast
      - id: debug-statements
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        stages: [pre-commit, pre-push]
        args: [--fix]
      - id: ruff-format
        stages: [pre-commit, pre-push]
